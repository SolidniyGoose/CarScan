<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Viewer</title>
    <!-- Use local model-viewer.js for offline capability -->
    <script type="module" src="js/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
        }

        /* Dark CAD Grid Background */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #13171D;
            background-image: 
                radial-gradient(circle at center, #262C36 0%, #13171D 100%),
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
            /* Disable selection highlight on Android */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hidden UI inside model viewer unless we explicitly enable it */
        .default-progress-bar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <model-viewer 
        id="viewer"
        src="models/car.glb" 
        camera-controls 
        interaction-prompt="none"
        camera-orbit="45deg 75deg 130%"
        max-camera-orbit="auto auto 200%"
        min-camera-orbit="auto auto 50%"
        field-of-view="30deg"
        exposure="0.75"
        shadow-intensity="2"
        shadow-softness="0.5">
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');
        const defaultOrbit = "45deg 75deg 130%";
        const defaultTarget = "auto auto auto";
        const defaultFov = "30deg";
        let interactionTimeout;

        viewer.addEventListener('camera-change', (event) => {
            if (event.detail.source === 'user-interaction') {
                clearTimeout(interactionTimeout);
                viewer.interpolationDecay = 100; // обычная скорость при свайпах
                
                interactionTimeout = setTimeout(() => {
                    viewer.interpolationDecay = 500; // умеренный возврат (было 1000)
                    viewer.cameraOrbit = defaultOrbit;
                    viewer.cameraTarget = defaultTarget;
                    viewer.fieldOfView = defaultFov;
                }, 3000); // 3 секунды бездействия
            }
        });
    </script>
</body>
</html>
