<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarScan 3D</title>
    <script>
        // Производительность: на планшетах devicePixelRatio 2–3, и при приближении к машине полупрозрачный
        // кузов на весь экран рисуется в 4–9 раз большем числе пикселей — FPS падал. model-viewer берёт
        // разрешение рендера из window.devicePixelRatio, поэтому ограничиваем его бюджетом ~1.8 Мпикс.
        // Подписи и текст — обычный HTML и остаются чёткими.
        //
        // Динамическое разрешение: пока камера движется (вращение, приближение, плавный возврат),
        // рендер идёт в пониженном разрешении; после остановки — один чёткий кадр. Встроенный автоскейлинг
        // model-viewer включается только ниже ~16 FPS, поэтому подлагивания на 30–40 FPS он не убирал.
        // model-viewer читает devicePixelRatio каждый кадр, так что смена значения применяется сразу.
        window.CARSCAN_QUALITY = (function () {
            const real = window.devicePixelRatio || 1;
            const cssPixels = Math.max(1, window.screen.width * window.screen.height);
            const idle = Math.max(1, Math.min(real, 1.5, Math.sqrt(1.8e6 / cssPixels)));
            const base = Math.max(0.75, Math.min(idle, idle * 0.62));
            // Слабая видеокарта (магнитола): если при вращении меньше ~35 кадров/с, разрешение в движении
            // снижается ступенями до 0.5; при запасе — возвращается. Подобранное значение запоминается.
            const MIN_MOVING = 0.5;
            let moving = base;
            try {
                const saved = parseFloat(localStorage.getItem('carscan.movingScale'));
                if (saved >= MIN_MOVING && saved <= base) moving = saved;
            } catch (e) { /* хранилище недоступно */ }
            let current = idle;
            let isMoving = false;
            let frames = 0, total = 0;
            try {
                Object.defineProperty(window, 'devicePixelRatio', { get: () => current, configurable: true });
            } catch (e) { /* старый WebView: оставляем как есть */ }
            return {
                idle,
                get moving() { return moving; },
                set(value) { isMoving = value; current = value ? moving : idle; },
                // Длительность кадра во время движения камеры (мс)
                frame(dt) {
                    if (!isMoving || dt <= 0 || dt > 250) return;
                    frames++; total += dt;
                    if (frames < 30) return;
                    const avg = total / frames;
                    frames = 0; total = 0;
                    let next = moving;
                    if (avg > 28) next = Math.max(MIN_MOVING, moving - 0.1);
                    else if (avg < 18) next = Math.min(base, moving + 0.05);
                    if (Math.abs(next - moving) < 0.001) return;
                    moving = next;
                    current = moving;
                    try { localStorage.setItem('carscan.movingScale', moving.toFixed(2)); } catch (e) { /* ничего */ }
                },
            };
        })();

        // model-viewer создаёт WebGL-контекст с preserveDrawingBuffer: true (нужно только для скриншотов).
        // На мобильных GPU (Adreno, Mali) это лишнее копирование всего кадра на каждом кадре — отключаем.
        (function () {
            const getContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attributes) {
                if ((type === 'webgl2' || type === 'webgl') && attributes && attributes.preserveDrawingBuffer) {
                    attributes = Object.assign({}, attributes, { preserveDrawingBuffer: false });
                }
                return getContext.call(this, type, attributes);
            };
        })();
    </script>
    <!-- Локальный model-viewer: 3D-сцена работает без интернета -->
    <script type="module" src="js/model-viewer.min.js"></script>
    <style>
        :root {
            /* Цвета темы (тройки RGB): меняются из Kotlin через carscan.update({ theme }) */
            --accent-rgb: 25, 227, 255;
            --glow-rgb: 44, 82, 118;
            --green: #3dff9a;
            --amber: #ffb02e;
            --red: #ff4d4d;
            --info: #6cc8ff;
            --text: #e8f1f8;
            --muted: #8ea3b5;
            --fs: clamp(11px, 3vh, 16px);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06090d;
            font-family: Roboto, "Segoe UI", system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Фон «гараж»: стена с панелями, световая полоса, подсветка центра */
        .backdrop {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 55% 45% at 50% 45%, rgba(var(--glow-rgb), 0.38), transparent 72%),
                linear-gradient(180deg, #0a1017 0%, #0e1620 50%, #06090d 100%);
        }
        .backdrop::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 56%;
            background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 11vw);
            -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%, #000 70%, transparent);
            mask-image: linear-gradient(180deg, transparent, #000 35%, #000 70%, transparent);
        }
        .backdrop::after {
            content: '';
            position: absolute;
            left: 22%;
            right: 22%;
            top: 5%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(170, 225, 255, 0.45), transparent);
            box-shadow: 0 0 28px 8px rgba(120, 200, 255, 0.12);
        }

        /* Пол с перспективной сеткой */
        .floor {
            position: absolute;
            left: -40%;
            right: -40%;
            bottom: 0;
            height: 52%;
            z-index: 0;
            transform-origin: 50% 100%;
            transform: perspective(70vh) rotateX(58deg);
            background-image:
                linear-gradient(rgba(var(--accent-rgb), 0.09) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--accent-rgb), 0.09) 1px, transparent 1px);
            background-size: 7vh 7vh;
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
        }

        /* Неоновая платформа-поворотный стол. Позиция и размер считаются из проекции пола модели */
        /* Слой 800×800 рисуется один раз; эллипс получается масштабированием на GPU (transform) */
        .stage {
            position: absolute;
            z-index: 1;
            left: 0;
            top: 0;
            width: 800px;
            height: 800px;
            margin: -400px 0 0 -400px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
            will-change: transform;
            transform: scale(0);
            background: radial-gradient(closest-side, rgba(var(--accent-rgb), 0.16), rgba(var(--accent-rgb), 0.05) 75%, rgba(var(--accent-rgb), 0.0) 100%);
            box-shadow:
                0 0 0 1.5px rgba(var(--accent-rgb), 0.6),
                0 0 26px 3px rgba(var(--accent-rgb), 0.35),
                inset 0 0 34px rgba(var(--accent-rgb), 0.28);
        }
        .stage.ready { opacity: 1; }
        .stage::before {
            content: '';
            position: absolute;
            inset: 9%;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), 0.28);
        }
        .stage .ticks {
            position: absolute;
            inset: -5%;
            border-radius: 50%;
            will-change: transform;
            background: repeating-conic-gradient(rgba(var(--accent-rgb), 0.55) 0deg 0.7deg, transparent 0.7deg 7.5deg);
            -webkit-mask-image: radial-gradient(closest-side, transparent 91%, #000 92%, #000 99%, transparent 100%);
            mask-image: radial-gradient(closest-side, transparent 91%, #000 92%, #000 99%, transparent 100%);
        }

        model-viewer {
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: transparent;
            --poster-color: transparent;
            --progress-bar-height: 0px;
        }

        /* Служебные невидимые хотспоты для расчёта платформы */
        .probe {
            visibility: hidden;
            width: 1px;
            height: 1px;
            padding: 0;
            border: 0;
            pointer-events: none;
        }

        /* Хотспоты узлов */
        .hs {
            --c: var(--green);
            --hc: rgba(0, 0, 0, 0);
            position: relative;
            width: 2px;
            height: 2px;
            padding: 0;
            border: 0;
            background: none;
            outline: none;
            transition: opacity 0.3s;
        }
        .hs > * { position: absolute; }
        .hs.lvl-ok { --c: var(--green); }
        .hs.lvl-info { --c: var(--info); }
        .hs.lvl-warn { --c: var(--amber); }
        .hs.lvl-crit { --c: var(--red); }
        .hs.lvl-off { --c: #5b6b78; }

        .hs .heat {
            left: 50%;
            top: 50%;
            width: var(--hsz, 24vh);
            height: var(--hsz, 24vh);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(closest-side, var(--hc) 0%, rgba(0, 0, 0, 0) 100%);
            opacity: 0;
            transition: opacity 0.6s, background 0.6s;
            pointer-events: none;
        }
        body.xray .hs .heat { opacity: 1; }

        .hs .ring {
            left: 50%;
            top: 50%;
            width: 3.6vh;
            height: 3.6vh;
            min-width: 14px;
            min-height: 14px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid var(--c);
            opacity: 0.45;
            pointer-events: none;
        }
        /* Пульсируют только предупреждения: бесконечная анимация шести колец держала WebView
           в режиме 60 кадров/с постоянно — на слабых магнитолах это тормозило весь экран */
        .hs.lvl-warn .ring, .hs.lvl-crit .ring { animation: pulse 1s ease-out infinite; }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
        }

        .hs .dot {
            left: 50%;
            top: 50%;
            width: 1.5vh;
            height: 1.5vh;
            min-width: 7px;
            min-height: 7px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: var(--c);
            box-shadow: 0 0 8px var(--c), 0 0 2px 1px rgba(255, 255, 255, 0.7) inset;
            pointer-events: auto;
        }

        .hs .lv, .hs .lh {
            background: var(--c);
            opacity: 0.75;
            box-shadow: 0 0 4px var(--c);
            pointer-events: none;
        }
        .hs .lv { width: 1px; }
        .hs .lh { height: 1px; }

        .hs .tag {
            white-space: nowrap;
            text-align: left;
            font-family: inherit;
            font-size: var(--fs);
            line-height: 1.25;
            color: var(--text);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            padding: 0.25em 0.5em;
            border-radius: 6px;
            background: rgba(8, 14, 20, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: auto;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }
        .hs .tag .t { display: block; font-weight: 500; letter-spacing: 0.02em; }
        .hs .tag .s { color: var(--c); font-weight: 500; }
        .hs .tag .m { color: var(--muted); }

        body.has-selection .hs { opacity: 0.45; }
        body.has-selection .hs.selected { opacity: 1; }
        .hs.selected .tag {
            border-color: rgb(var(--accent-rgb));
            background: rgba(10, 30, 40, 0.8);
            box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.45);
        }

        .loading {
            position: absolute;
            z-index: 3;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: var(--muted);
            font-size: var(--fs);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .loading .bar {
            margin: 0.8em auto 0;
            width: 22vh;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        .loading .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: rgb(var(--accent-rgb));
            box-shadow: 0 0 8px rgb(var(--accent-rgb));
        }
        .loading.done { opacity: 0; }
    </style>
</head>
<body class="xray">
    <div class="backdrop"></div>
    <div class="floor"></div>
    <div class="stage" id="stage"><div class="ticks" id="stageTicks"></div></div>

    <model-viewer
        id="viewer"
        src="models/car.glb"
        camera-controls
        disable-pan
        interaction-prompt="none"
        camera-orbit="45deg 75deg 125%"
        max-camera-orbit="auto 88deg 260%"
        min-camera-orbit="auto auto 55%"
        field-of-view="30deg"
        exposure="0.75"
        shadow-intensity="2"
        shadow-softness="0.5">
    </model-viewer>

    <div class="loading" id="loading">Загрузка 3D-модели<div class="bar"><i id="loadingBar"></i></div></div>

    <script>
        const viewer = document.getElementById('viewer');
        const stage = document.getElementById('stage');
        const stageTicks = document.getElementById('stageTicks');
        const DEFAULT_TARGET = 'auto auto auto';
        const DEFAULT_FOV = '30deg';
        const IDLE_RETURN_MS = 3000;

        // Узлы автомобиля. f — положение в долях габаритов модели:
        //   x: -1..1 (поперёк), y: 0..1 (от пола вверх), z: -1..1 (зад..перед).
        // dx/dy — смещение подписи от точки в % высоты 3D-зоны (выноска «ломаной»).
        const NODES = [
            { id: 'engine',       title: 'Двигатель ДВС',  f: [0.00, 0.50, 0.54],  dx: -4,  dy: -24, heat: 18 },
            { id: 'battery',      title: 'Электросеть',    f: [-0.40, 0.52, 0.80], dx: -3,  dy: 22,  heat: 16 },
            { id: 'transmission', title: 'АКПП',           f: [0.00, 0.26, 0.30],  dx: 3,   dy: 30,  heat: 24 },
            { id: 'climate',      title: 'Салон',          f: [0.00, 0.62, -0.08], dx: -3,  dy: -34, heat: 30 },
            { id: 'fuel',         title: 'Топливный бак',  f: [0.00, 0.24, -0.38], dx: 4,   dy: 23,  heat: 0 },
            { id: 'exhaust',      title: 'Выхлоп',         f: [0.35, 0.12, -0.94], dx: 3,   dy: -22, heat: 16 },
        ];
        const nodeById = {};

        // Безопасная зона: часть экрана между панелями Compose (доли ширины/высоты).
        // Kotlin присылает точные значения через carscan.setSafeArea().
        const safe = { l: 0.26, t: 0.10, r: 0.30, b: 0.125 };
        function safeRect() {
            const w = window.innerWidth, h = window.innerHeight;
            const left = safe.l * w, right = w - safe.r * w, top = safe.t * h, bottom = h - safe.b * h;
            return { left, right, top, bottom, width: right - left, height: bottom - top };
        }

        // Стартовый ракурс: радиус камеры подбирается так, чтобы машина с подписями вписалась в безопасную зону
        let fitRadius = 125;
        let currentRadius = 125;
        const defaultOrbit = () => `45deg 75deg ${fitRadius.toFixed(0)}%`;
        let modelBox = null;       // { c: {x,y,z}, d: {x,y,z} }
        let lastData = null;       // последнее состояние, пришедшее из Kotlin
        let selectedId = null;
        let focusedId = null;
        let interactionTimeout = null;
        let xrayEnabled = true;
        let xrayTint = [0.42, 0.62, 0.82];
        let themeId = null;
        let originalMaterials = null;

        // ---------- Мост в Kotlin ----------
        function notifyNodeTapped(id) {
            if (window.AndroidBridge && window.AndroidBridge.onNodeTapped) {
                window.AndroidBridge.onNodeTapped(id);
            } else {
                // Режим отладки в обычном браузере
                window.carscan.update(Object.assign({}, lastData, { selected: id }));
                window.carscan.focus(id);
            }
        }

        // ---------- Загрузка ----------
        viewer.addEventListener('progress', (e) => {
            const p = Math.round((e.detail.totalProgress || 0) * 100);
            document.getElementById('loadingBar').style.width = p + '%';
        });

        viewer.addEventListener('load', () => {
            document.getElementById('loading').classList.add('done');
            const c = viewer.getBoundingBoxCenter();
            const d = viewer.getDimensions();
            modelBox = { c: { x: c.x, y: c.y, z: c.z }, d: { x: d.x, y: d.y, z: d.z } };
            captureMaterials();
            createProbes();
            createHotspots();
            fitCamera(2);
            applyXray(xrayEnabled);
            if (lastData) applyData(lastData);
            else if (!window.AndroidBridge) setTimeout(() => { if (!lastData) window.carscan.update(DEMO); }, 300);
            kickStage(60);
        });

        function modelPoint(f) {
            const { c, d } = modelBox;
            return {
                x: c.x + f[0] * d.x / 2,
                y: (c.y - d.y / 2) + f[1] * d.y,
                z: c.z + f[2] * d.z / 2,
            };
        }
        const vec = (p) => `${p.x} ${p.y} ${p.z}`;

        // ---------- Рентген-режим ----------
        const BODY_MATERIALS = ['Polar_White', 'Color_M01', 'Color_M02', 'Color_M03', 'Color_M04'];
        // Детали, добавленные в car.glb скриптом tools/add_car_parts.py
        const ENGINE_MATERIALS = ['CS_EngineBlock', 'CS_EngineHead', 'CS_EngineCover', 'CS_EnginePulley'];
        const FUEL_SLICE = /^CS_Fuel_(\d+)$/;
        let fuelSlices = 0;
        // Состояние деталей из телеметрии: нагрев 0..1 и уровень топлива 0..1 (null — нет данных)
        const parts = { engine: 0, exhaust: 0, fuel: null };
        let partsKey = '';
        // Любая смена материала — полная перерисовка 3D-кадра. Нагрузка двигателя (свечение выхлопа)
        // меняется на каждом опросе, поэтому выхлоп обновляется не чаще раза в EXHAUST_PERIOD_MS
        const EXHAUST_PERIOD_MS = 4000;
        let shownExhaust = 0, exhaustAt = 0, exhaustTimer = null;

        function captureMaterials() {
            fuelSlices = viewer.model.materials.filter((m) => FUEL_SLICE.test(m.name)).length;
            originalMaterials = viewer.model.materials.map((m) => ({
                m,
                alphaMode: m.getAlphaMode(),
                base: m.pbrMetallicRoughness.baseColorFactor.slice(),
                metal: m.pbrMetallicRoughness.metallicFactor,
                rough: m.pbrMetallicRoughness.roughnessFactor,
                emissive: m.emissiveFactor.slice(),
            }));
        }

        function applyXray(on) {
            document.body.classList.toggle('xray', on);
            if (!originalMaterials) return;
            for (const o of originalMaterials) {
                const { m } = o;
                const pbr = m.pbrMetallicRoughness;
                if (!on) {
                    m.setAlphaMode(o.alphaMode);
                    pbr.setBaseColorFactor(o.base);
                    pbr.setMetallicFactor(o.metal);
                    pbr.setRoughnessFactor(o.rough);
                    m.setEmissiveFactor(o.emissive);
                    continue;
                }
                if (BODY_MATERIALS.includes(m.name)) {
                    m.setAlphaMode('BLEND');
                    pbr.setBaseColorFactor([...xrayTint, 0.17]);
                    pbr.setMetallicFactor(0.1);
                    pbr.setRoughnessFactor(0.25);
                    m.setEmissiveFactor(xrayTint.map((v) => v * 0.1));
                } else if (m.name === 'Interior') {
                    // Салон в рентгене скрыт (MASK + альфа 0 отбрасывает пиксели до расчёта света):
                    // полупрозрачный, он почти не был виден, но при приближении удваивал нагрузку на GPU
                    m.setAlphaMode('MASK');
                    pbr.setBaseColorFactor([0.10, 0.15, 0.20, 0]);
                } else if (m.name === 'UnderCarriage') {
                    m.setAlphaMode('BLEND');
                    pbr.setBaseColorFactor([0.10, 0.12, 0.14, 0.3]);
                } else if (m.name === 'WindowsTint') {
                    pbr.setBaseColorFactor([0.08, 0.16, 0.24, 0.12]);
                } else if (m.name === 'CS_FuelTank') {
                    // Полупрозрачный бак, чтобы был виден уровень топлива внутри
                    m.setAlphaMode('BLEND');
                    pbr.setBaseColorFactor([...xrayTint.map((v) => v * 0.6), 0.28]);
                }
            }
            partsKey = '';
            applyParts();
            viewer.exposure = on ? 1.0 : 0.75;
        }

        // ---------- Платформа ----------
        function createProbes() {
            const { c, d } = modelBox;
            const floorY = c.y - d.y / 2;
            const r = d.z * 0.6;
            const probes = {
                'hotspot-probe-c': { x: c.x, y: floorY, z: c.z },
                'hotspot-probe-x': { x: c.x + r, y: floorY, z: c.z },
                'hotspot-probe-z': { x: c.x, y: floorY, z: c.z + r },
            };
            for (const [slot, p] of Object.entries(probes)) {
                const el = document.createElement('button');
                el.slot = slot;
                el.className = 'probe';
                el.dataset.position = vec(p);
                el.dataset.normal = '0 1 0';
                viewer.appendChild(el);
            }
        }

        function rectCenter(slot) {
            const el = viewer.querySelector(`[slot="${slot}"]`);
            if (!el) return null;
            const r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        let stageFrames = 0;
        let lastStageTime = 0;
        function kickStage(frames) {
            const wasIdle = stageFrames <= 0;
            stageFrames = Math.max(stageFrames, frames || 30);
            if (wasIdle) {
                lastStageTime = 0;
                requestAnimationFrame(stageLoop);
            }
        }
        function stageLoop(time) {
            if (lastStageTime) window.CARSCAN_QUALITY.frame(time - lastStageTime);
            lastStageTime = time;
            updateStage();
            if (--stageFrames > 0) requestAnimationFrame(stageLoop);
            else clampTags();
        }
        function updateStage() {
            const c = rectCenter('hotspot-probe-c');
            const ax = rectCenter('hotspot-probe-x');
            const az = rectCenter('hotspot-probe-z');
            if (!c || !ax || !az) return;
            // Проекция горизонтального круга: полуоси эллипса по осям экрана
            const halfW = Math.hypot(ax.x - c.x, az.x - c.x);
            const halfH = Math.max(Math.hypot(ax.y - c.y, az.y - c.y), halfW * 0.08);
            stage.style.transform =
                `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px) scale(${(halfW / 400).toFixed(4)}, ${(halfH / 400).toFixed(4)})`;
            const orbit = viewer.getCameraOrbit();
            stageTicks.style.transform = `rotate(${(orbit.theta * 180 / Math.PI).toFixed(1)}deg)`;
            stage.classList.add('ready');
        }

        // Подписи не должны заходить под панели: по горизонтали сдвигаем подпись,
        // по вертикали укорачиваем выноску. Сдвиг считается от исходного положения, поэтому не «дрожит»
        function clampTags() {
            const vr = safeRect();
            const pad = 4;
            for (const id in nodeById) {
                const entry = nodeById[id];
                const tag = entry.el.querySelector('.tag');
                const r = tag.getBoundingClientRect();
                const left = r.left - entry.shiftX, right = r.right - entry.shiftX;
                const top = r.top - entry.shiftY, bottom = r.bottom - entry.shiftY;
                let nx = 0, ny = 0;
                if (left < vr.left + pad) nx = vr.left + pad - left;
                else if (right > vr.right - pad) nx = vr.right - pad - right;
                if (top < vr.top + pad) ny = vr.top + pad - top;
                else if (bottom > vr.bottom - pad) ny = vr.bottom - pad - bottom;
                if (Math.abs(nx - entry.shiftX) > 0.5) {
                    entry.shiftX = nx;
                    tag.style.marginLeft = nx.toFixed(1) + 'px';
                }
                if (Math.abs(ny - entry.shiftY) > 0.5) {
                    entry.shiftY = ny;
                    layoutNode(entry, safeRect().height / 100);
                }
            }
        }
        function onViewportChanged() {
            layoutLeaders();
            if (!focusedId && modelBox) fitCamera(2);
            kickStage(60);
        }

        function createCornerProbes() {
            if (viewer.querySelector('.probe.corner')) return;
            const { c, d } = modelBox;
            for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
                const el = document.createElement('button');
                el.slot = `hotspot-probe-${sx}${sy}${sz}`;
                el.className = 'probe corner';
                el.dataset.position = vec({ x: c.x + sx * d.x / 2, y: c.y + sy * d.y / 2, z: c.z + sz * d.z / 2 });
                el.dataset.normal = '0 1 0';
                viewer.appendChild(el);
            }
        }

        // Проекция габаритов машины на экран (по 8 невидимым хотспотам в углах bounding box)
        function carScreenRect() {
            let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
            viewer.querySelectorAll('.probe.corner').forEach((el) => {
                const q = el.getBoundingClientRect();
                const x = q.left + q.width / 2, y = q.top + q.height / 2;
                l = Math.min(l, x); r = Math.max(r, x); t = Math.min(t, y); b = Math.max(b, y);
            });
            return r > l ? { width: r - l, height: b - t } : null;
        }

        // Видимый размер обратно пропорционален дистанции камеры: пара итераций даёт точную подгонку
        function fitCamera(iterations) {
            createCornerProbes();
            requestAnimationFrame(() => requestAnimationFrame(() => {
                const car = carScreenRect();
                const zone = safeRect();
                if (!car || zone.width <= 0 || zone.height <= 0) return;
                const k = Math.max(car.width / (zone.width * 0.68), car.height / (zone.height * 0.55));
                fitRadius = Math.max(60, Math.min(220, currentRadius * k));
                viewer.cameraTarget = DEFAULT_TARGET;
                viewer.cameraOrbit = defaultOrbit();
                currentRadius = fitRadius;
                viewer.jumpCameraToGoal();
                kickStage(30);
                if (iterations > 1) fitCamera(iterations - 1);
                else viewer.querySelectorAll('.probe.corner').forEach((el) => el.remove());
            }));
        }
        window.addEventListener('resize', onViewportChanged);

        // ---------- Хотспоты ----------
        function createHotspots() {
            for (const n of NODES) {
                const el = document.createElement('button');
                el.slot = 'hotspot-' + n.id;
                el.className = 'hs lvl-off';
                el.dataset.position = vec(modelPoint(n.f));
                el.dataset.normal = '0 1 0';
                el.innerHTML =
                    '<span class="heat"></span><span class="ring"></span>' +
                    '<span class="lv"></span><span class="lh"></span><span class="dot"></span>' +
                    `<span class="tag"><span class="t">${n.title}:</span><span class="s">—</span><span class="m"></span></span>`;
                el.dataset.heat = n.heat;
                const tap = (e) => { e.stopPropagation(); notifyNodeTapped(n.id); };
                el.querySelector('.tag').addEventListener('click', tap);
                el.querySelector('.dot').addEventListener('click', tap);
                viewer.appendChild(el);
                nodeById[n.id] = { cfg: n, el, pos: modelPoint(n.f), shiftX: 0, shiftY: 0 };
            }
            layoutLeaders();
        }

        // Выноски: вертикальный отрезок от точки, затем горизонтальный к подписи
        function layoutLeaders() {
            const vh = safeRect().height / 100;
            for (const id in nodeById) layoutNode(nodeById[id], vh);
        }

        function layoutNode(entry, vh) {
            const { cfg, el } = entry;
            el.style.setProperty('--hsz', (cfg.heat * vh) + 'px');
            const dx = cfg.dx * vh, dy = cfg.dy * vh + entry.shiftY;
            const lv = el.querySelector('.lv'), lh = el.querySelector('.lh'), tag = el.querySelector('.tag');
            lv.style.left = '1px';
            lv.style.top = (dy < 0 ? dy : 1) + 'px';
            lv.style.height = Math.abs(dy) + 'px';
            lh.style.top = (dy + 1) + 'px';
            lh.style.left = (dx < 0 ? dx : 1) + 'px';
            lh.style.width = Math.abs(dx) + 'px';
            tag.style.top = (dy + 1) + 'px';
            tag.style.left = (dx + 1) + 'px';
            tag.style.transform = `translate(${dx < 0 ? '-100%' : '0'}, -50%)`;
        }

        function heatColor(t, palette) {
            const c = heatRgb(t, palette);
            return `rgba(${c[0]}, ${c[1]}, ${c[2]}, 0.62)`;
        }

        // Подсветка деталей в рентгене: двигатель — по температуре ОЖ, выхлоп — по нагрузке,
        // в баке видно столько слоёв «топлива», сколько его осталось
        function applyParts() {
            if (!originalMaterials) return;
            const visible = parts.fuel == null ? fuelSlices : Math.ceil(parts.fuel * fuelSlices - 0.01);
            const q = (v, step) => Math.round(v / step) * step;
            // Вне рентгена свечения нет — изменения температуры и нагрузки не требуют перерисовки
            const engineHeat = xrayEnabled ? q(parts.engine, 0.05) : 0;
            let exhaustHeat = xrayEnabled ? q(parts.exhaust, 0.1) : 0;
            const now = performance.now();
            if (Math.abs(exhaustHeat - shownExhaust) > 0.001) {
                const wait = EXHAUST_PERIOD_MS - (now - exhaustAt);
                if (wait > 0 && xrayEnabled && shownExhaust > 0) {
                    exhaustHeat = shownExhaust;
                    if (!exhaustTimer) exhaustTimer = setTimeout(() => { exhaustTimer = null; applyParts(); }, wait);
                } else {
                    shownExhaust = exhaustHeat;
                    exhaustAt = now;
                }
            }
            const key = [xrayEnabled, engineHeat.toFixed(2), exhaustHeat.toFixed(2), visible, themeId].join('|');
            if (key === partsKey) return;
            partsKey = key;
            const glow = (rgb, k) => (xrayEnabled ? rgb.map((v) => (v / 255) * k) : [0, 0, 0]);
            const engine = glow(heatRgb(engineHeat, 'thermal'), 0.38);
            const exhaust = glow(heatRgb(exhaustHeat, 'thermal'), 0.6);
            const fuelRgb = heatRgb(parts.fuel ?? 0.6, 'level').map((v) => v / 255);
            for (const m of viewer.model.materials) {
                if (ENGINE_MATERIALS.includes(m.name)) {
                    m.setEmissiveFactor(engine);
                } else if (m.name === 'CS_Exhaust') {
                    m.setEmissiveFactor(exhaust);
                } else if (xrayEnabled) {
                    const slice = FUEL_SLICE.exec(m.name);
                    if (!slice) continue;
                    const on = Number(slice[1]) < visible;
                    // Режим MASK: альфа 0 полностью скрывает слой выше уровня топлива
                    m.pbrMetallicRoughness.setBaseColorFactor(on ? [...fuelRgb, 1] : [0, 0, 0, 0]);
                    m.setEmissiveFactor(on ? fuelRgb.map((v) => v * 0.45) : [0, 0, 0]);
                }
            }
        }

        function heatRgb(t, palette) {
            t = Math.max(0, Math.min(1, t));
            const stops = palette === 'level'
                ? [[0, [255, 70, 60]], [0.25, [255, 170, 40]], [0.5, [40, 220, 200]], [1, [40, 150, 255]]]
                : [[0, [40, 110, 255]], [0.35, [30, 220, 210]], [0.6, [250, 220, 40]], [0.8, [255, 130, 20]], [1, [255, 40, 30]]];
            for (let i = 1; i < stops.length; i++) {
                if (t <= stops[i][0]) {
                    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
                    const k = (t - t0) / (t1 - t0);
                    return c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
                }
            }
            return stops[stops.length - 1][1];
        }

        // Тема: CSS-переменные для свечения/платформы и оттенок «стекла» в рентгене
        function applyTheme(theme) {
            if (!theme || theme.id === themeId) return;
            themeId = theme.id;
            const root = document.documentElement.style;
            root.setProperty('--accent-rgb', theme.accent);
            root.setProperty('--glow-rgb', theme.glow);
            xrayTint = theme.xray.split(',').map((v) => parseInt(v, 10) / 255);
            if (xrayEnabled) applyXray(true);
        }

        function applyData(data) {
            applyTheme(data.theme);
            if (!modelBox) return;
            if (typeof data.xray === 'boolean' && data.xray !== xrayEnabled) {
                xrayEnabled = data.xray;
                applyXray(xrayEnabled);
            }
            selectedId = data.selected || null;
            document.body.classList.toggle('has-selection', !!selectedId);
            for (const n of (data.nodes || [])) {
                const entry = nodeById[n.id];
                if (!entry) continue;
                const { el } = entry;
                const heat = typeof n.heat === 'number' ? n.heat : 0;
                const signature = [n.level, n.status, n.value, heat.toFixed(2), n.id === selectedId].join('|');
                if (signature !== entry.signature) {
                    entry.signature = signature;
                    el.className = 'hs lvl-' + (n.level || 'off') + (n.id === selectedId ? ' selected' : '');
                    el.querySelector('.s').textContent = n.status || '—';
                    el.querySelector('.m').textContent = n.value ? ' · ' + n.value : '';
                    el.style.setProperty('--hc', heatColor(heat, n.id === 'fuel' ? 'level' : 'thermal'));
                }
                if (n.id === 'engine') parts.engine = n.level === 'off' ? 0 : heat;
                if (n.id === 'exhaust') parts.exhaust = n.level === 'off' ? 0 : heat;
                if (n.id === 'fuel') parts.fuel = n.level === 'off' ? null : heat;
            }
            applyParts();
        }

        // ---------- Камера ----------
        function focusView(id) {
            const entry = nodeById[id];
            if (!entry) return null;
            const p = entry.pos;
            const theta = viewer.getCameraOrbit().theta * 180 / Math.PI;
            const radius = fitRadius * 0.6;
            return { target: `${p.x}m ${p.y}m ${p.z}m`, orbit: `${theta.toFixed(1)}deg 62deg ${radius.toFixed(0)}%`, radius };
        }

        function moveCamera(target, orbit, decay, radiusPct) {
            currentRadius = radiusPct;
            viewer.interpolationDecay = decay;
            viewer.cameraTarget = target;
            viewer.cameraOrbit = orbit;
            viewer.fieldOfView = DEFAULT_FOV;
            kickStage(120);
        }

        // Пониженное разрешение, пока камера в движении; через 350 мс покоя — полное
        let qualityTimer = null;
        function markCameraMoving() {
            window.CARSCAN_QUALITY.set(true);
            clearTimeout(qualityTimer);
            qualityTimer = setTimeout(() => window.CARSCAN_QUALITY.set(false), 350);
        }

        viewer.addEventListener('camera-change', (event) => {
            markCameraMoving();
            kickStage(20);
            if (event.detail.source !== 'user-interaction') return;
            clearTimeout(interactionTimeout);
            viewer.interpolationDecay = 100; // мгновенный отклик при свайпах
            interactionTimeout = setTimeout(() => {
                // После 3 с бездействия плавно возвращаемся к выбранному узлу или к стартовому ракурсу
                const v = focusedId ? focusView(focusedId) : null;
                if (v) moveCamera(v.target, v.orbit, 500, v.radius);
                else moveCamera(DEFAULT_TARGET, defaultOrbit(), 500, fitRadius);
            }, IDLE_RETURN_MS);
        });

        // ---------- API для Kotlin ----------
        window.carscan = {
            update(data) {
                lastData = data;
                applyData(data);
            },
            focus(id) {
                const v = focusView(id);
                if (!v) return;
                clearTimeout(interactionTimeout);
                focusedId = id;
                moveCamera(v.target, v.orbit, 250, v.radius);
            },
            resetCamera() {
                clearTimeout(interactionTimeout);
                focusedId = null;
                moveCamera(DEFAULT_TARGET, defaultOrbit(), 350, fitRadius);
            },
            // Доли экрана, занятые панелями Compose: 3D-модель вписывается в оставшийся центр
            setSafeArea(left, top, right, bottom) {
                const clamp = (v) => Math.max(0, Math.min(0.45, v));
                safe.l = clamp(left); safe.t = clamp(top); safe.r = clamp(right); safe.b = clamp(bottom);
                onViewportChanged();
            },
        };

        // Демо-данные для открытия страницы в обычном браузере (в приложении их заменяет телеметрия)
        const DEMO = {
            xray: true,
            selected: null,
            nodes: [
                { id: 'engine', status: 'Исправен', value: '92 °C', level: 'ok', heat: 0.8 },
                { id: 'battery', status: 'Зарядка', value: '14.1 V', level: 'ok', heat: 0.4 },
                { id: 'transmission', status: 'Норма', value: 'ATF 74 °C', level: 'ok', heat: 0.6 },
                { id: 'climate', status: '22 °C', value: 'ул. +9 °C', level: 'info', heat: 0.45 },
                { id: 'fuel', status: '62 %', value: '55.8 л', level: 'ok', heat: 0.62 },
                { id: 'exhaust', status: 'В норме', value: '', level: 'ok', heat: 0.5 },
            ],
        };
    </script>
</body>
</html>
