name: Release APK

# Публикация обновления (подробно — docs/UPDATES.md):
#   git tag v1.0.1
#   git push origin v1.0.1
# Workflow собирает подписанный APK и создаёт релиз; приложение находит его кнопкой «Проверить».
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Android SDK уже установлен на раннерах GitHub (ANDROID_HOME); недостающую платформу Gradle скачает сам
      - name: Ключ подписи из секретов репозитория
        env:
          KEYSTORE_BASE64: ${{ secrets.CARSCAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет CARSCAN_KEYSTORE_BASE64 — см. docs/UPDATES.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Сборка APK
        env:
          CARSCAN_KEYSTORE: release.jks
          CARSCAN_KEYSTORE_PASSWORD: ${{ secrets.CARSCAN_KEYSTORE_PASSWORD }}
          CARSCAN_KEY_ALIAS: ${{ secrets.CARSCAN_KEY_ALIAS }}
          CARSCAN_KEY_PASSWORD: ${{ secrets.CARSCAN_KEY_PASSWORD }}
          # Необязательно: бот для отчётов диагностики (docs/DEBUG_REPORT.md)
          CARSCAN_TG_BOT_TOKEN: ${{ secrets.CARSCAN_TG_BOT_TOKEN }}
          CARSCAN_TG_CHAT_ID: ${{ secrets.CARSCAN_TG_CHAT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest -PappVersion="${GITHUB_REF_NAME#v}" --no-daemon 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          mv app/build/outputs/apk/release/app-release.apk "CarScan-${GITHUB_REF_NAME}.apk"

      # Причина ошибки — в аннотации запуска: её видно на странице Actions без раскрытия логов
      - name: Причина ошибки
        if: failure()
        run: |
          grep -A12 "What went wrong" build.log | head -30 | tr '\n' ' ' | sed 's/^/::error::/' || true
          echo
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -q "<failure" "$f" 2>/dev/null && grep -A3 "<failure" "$f" | head -4 | tr '\n' ' ' | sed "s|^|::error::$(basename "$f"): |" && echo
          done || true
          grep -E "^e: " build.log | head -10 | sed 's/^/::error::/' || true

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: CarScan-${{ github.ref_name }}.apk
          generate_release_notes: true
