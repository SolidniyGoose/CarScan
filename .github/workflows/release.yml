name: Release APK

# Публикация обновления (подробно — docs/UPDATES.md):
#   git tag v1.0.1
#   git push origin v1.0.1
# Workflow собирает подписанный APK и создаёт релиз; приложение находит его кнопкой «Проверить».
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Android SDK уже установлен на раннерах GitHub (ANDROID_HOME); недостающую платформу Gradle скачает сам
      - name: Ключ подписи из секретов репозитория
        env:
          KEYSTORE_BASE64: ${{ secrets.CARSCAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет CARSCAN_KEYSTORE_BASE64 — см. docs/UPDATES.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Сборка APK
        env:
          CARSCAN_KEYSTORE: release.jks
          CARSCAN_KEYSTORE_PASSWORD: ${{ secrets.CARSCAN_KEYSTORE_PASSWORD }}
          CARSCAN_KEY_ALIAS: ${{ secrets.CARSCAN_KEY_ALIAS }}
          CARSCAN_KEY_PASSWORD: ${{ secrets.CARSCAN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest -PappVersion="${GITHUB_REF_NAME#v}" --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "CarScan-${GITHUB_REF_NAME}.apk"

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: CarScan-${{ github.ref_name }}.apk
          generate_release_notes: true
